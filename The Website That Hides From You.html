 if(room==1&&!nothingDone&&nr&&P.x>nr.left-8&&P.x<nr.right+8&&P.y>nr.top-8&&P.y<nr.bottom+8){nothingDone=true;$('#no').style.opacity=1;$('#no').textContent='SOMETHING';secret('nothing');say('WELL. NOW THERE IS.',2800,1);return}
 if(room==1&&!hidden.f&&Math.hypot(P.x-hidden.x,P.y-hidden.y)<28){hidden.f=true;secret('invisible');$('#star').classList.add('on');say('YOU FOUND THE INVISIBLE ONE.',3000,1);beep(900,.4,'sine',.06,1400);return}
 let h=null,hd=1e9;for(const o of O){if(!o.on||o.busy||o.kind==='chaser')continue;const ed=Math.max(Math.abs(P.x-o.x)-o.w/2,Math.abs(P.y-o.y)-o.h/2);if(ed<hd){hd=ed;h=o}}
 if(!h||hd>28){knock();return}
 if(h.dead>performance.now()){h.dead=0;h.el.textContent=h.label;h.sta=Math.max(0,h.sta-3);say('...I WAS RESTING.',2000,1);tp(h,spot(h));return}
 if(h.label==='I AM HUMAN'){if(straight()<.9){$('#star').classList.add('on');secret('human');say('FINE. YOU ARE HUMAN.',2600,1);beep(700,.2)}else say('TOO STRAIGHT. ARE YOU A BOT?',2400,1);tp(h,spot(h));return}
 if(h.decoy||h.sta<=0||h.tame||(trust&&h.label==='LEAVE'))return caught(h);
 S.fail++;fails++;h.sta=Math.max(0,h.sta-1.5);tp(h,fails%3==2?behind():spot(h));tease();beep(200,.12,'square',.03,90)});

let kb='';addEventListener('keydown',e=>{

 else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a')secret('select');

  if(kb.endsWith('PLEASE')){secret('please');O.forEach(o=>o.sta=0);say('...FINE.',2200,1);kb=''}

  if(kb.endsWith('HELLO')){secret('hello');say('...HELLO.',2400,1);O.forEach(o=>o.sta=Math.min(o.sta,3));kb=''}

  if(kb.endsWith('DARK')){document.documentElement.setAttribute('data-theme','dark');say('INTO THE SHADOWS.',2000,1);kb=''}
  if(kb.endsWith('HINT')||kb.endsWith('CLUE')){
   const locked=SEC_INFO.filter(s=>!S.sec.includes(s.id));
   say(locked.length?`CLUE: ${locked[Math.floor(rnd()*locked.length)].hint}`:'YOU HAVE DISCOVERED ALL SECRETS.',3400,1);kb=''}
}});

let last=performance.now(),tickT=0;
function draw(){let nd=1e9,near=null;const T=rm?0:1;
 for(const o of O){const off=room==2?(P.x-W/2)*o.z*-.0003:0,tx=room==2?(P.x-o.x)/W*14*T:0,ty=room==2?(o.y-P.y)/H*10*T:0;
  o.el.style.transform=`translate3d(${o.x-o.w/2+off}px,${o.y-o.h/2}px,0) perspective(500px) rotateY(${tx}deg) rotateX(${ty}deg) scale(${o.sc*(1+o.z/900)})`;

 tet.style.opacity=tt?.35:0;
 return nd}

 if(!over){S.time+=dt;idle=P.sp<25?idle+dt:0;

 extras(t,dt);
 const nd=draw();
 if(snd&&!over&&t-tickT>260&&nd<200){tickT=t;beep(200+(1-nd/200)*500,.04,'sine',.015)}}
